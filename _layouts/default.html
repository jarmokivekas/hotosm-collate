<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ meta.title | default("Untitled") }}</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>{{ meta.title | default("Documentation") }}</h1>
  </header>

  <main>
    <!-- content is already rendered to HTML; mark safe -->
    <div class="content">{{ content | safe }}</div>
  </main>

  <footer>
    <small>Generated from {{ source }}</small>
  </footer>
</body>
</html>
